<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Kim Đĩnh - KIM ĐĨNH JIMMY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Be Vietnam Pro', 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #050403;
            font-family: 'Be Vietnam Pro', 'Inter', system-ui, -apple-system, sans-serif;
            font-variant-numeric: tabular-nums;
        }
        ::placeholder {
            color: #8a6d33;
            opacity: 1; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative font-['Be_Vietnam_Pro'] overflow-x-hidden">

    <div class="absolute inset-0 z-0 bg-[#050403] opacity-95"></div>
    <div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_50%_0%,_rgba(255,208,67,0.15)_0%,_transparent_60%),radial-gradient(circle_at_50%_100%,_rgba(255,208,67,0.08)_0%,_transparent_50%)]"></div>

    <div class="w-full max-w-[26rem] relative z-10 bg-[#0a0806] border border-[#ffcf40]/70 rounded-[1.5rem] p-6 shadow-[0_0_50px_rgba(255,208,67,0.2)] ring-1 ring-inset ring-[#ffcf40]/30">
        
        <!-- Họa tiết 4 góc -->
        <svg class="absolute top-1.5 left-1.5 w-7 h-7 text-[#ffcf40] opacity-90" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M 0,100 C 0,50 50,0 100,0" />
            <path d="M 0,70 C 0,35 35,0 70,0" />
            <circle cx="15" cy="15" r="5" fill="currentColor" stroke="none" />
        </svg>
        <svg class="absolute top-1.5 right-1.5 w-7 h-7 text-[#ffcf40] opacity-90" style="transform: scaleX(-1);" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M 0,100 C 0,50 50,0 100,0" />
            <path d="M 0,70 C 0,35 35,0 70,0" />
            <circle cx="15" cy="15" r="5" fill="currentColor" stroke="none" />
        </svg>
        <svg class="absolute bottom-1.5 left-1.5 w-7 h-7 text-[#ffcf40] opacity-90" style="transform: scaleY(-1);" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M 0,100 C 0,50 50,0 100,0" />
            <path d="M 0,70 C 0,35 35,0 70,0" />
            <circle cx="15" cy="15" r="5" fill="currentColor" stroke="none" />
        </svg>
        <svg class="absolute bottom-1.5 right-1.5 w-7 h-7 text-[#ffcf40] opacity-90" style="transform: scale(-1, -1);" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M 0,100 C 0,50 50,0 100,0" />
            <path d="M 0,70 C 0,35 35,0 70,0" />
            <circle cx="15" cy="15" r="5" fill="currentColor" stroke="none" />
        </svg>

        <div class="relative px-2 py-2">
            <!-- Header -->
            <div class="flex items-center justify-center space-x-3 mb-3">
                <div class="w-7 h-7 rounded-full bg-gradient-to-br from-[#fff3c7] to-[#e5ac27] flex items-center justify-center p-[2px] shadow-[0_0_15px_rgba(255,208,67,0.6)]">
                    <div class="w-full h-full rounded-full border border-[#b08011] bg-[#ffcf40] flex items-center justify-center">
                        <div class="w-3.5 h-3.5 rounded-full border-[1.5px] border-[#fff3c7] border-dashed"></div>
                    </div>
                </div>
                <h1 class="text-xl sm:text-2xl font-black tracking-wider text-[#fde38c] drop-shadow-[0_2px_5px_rgba(0,0,0,1)]">
                    KIM ĐĨNH JIMMY
                </h1>
            </div>

            <!-- Hàng SERVER & TỶ GIÁ -->
            <div class="flex items-center justify-between mb-3 border-b border-[#e5ac27]/40 pb-3 gap-2">
                <!-- Khu vực chọn SERVER (căn lề trái) -->
                <div class="flex items-center space-x-1.5 min-w-0">
                    <!-- Ô nhập số hiệu server -->
                    <div class="flex items-baseline border border-[#e5ac27]/70 bg-black/60 rounded-xl px-2 py-1 shadow-[inset_0_0_10px_rgba(0,0,0,0.9)] shrink-0">
                        <span class="text-[#ffcf40] text-sm font-bold select-none leading-none relative" style="line-height: 1; vertical-align: baseline;">S</span>
                        <input type="text" inputmode="numeric" id="input_server_num" value="1" placeholder="1" title="Nhập số Server"
                            class="w-5 sm:w-6 bg-transparent text-[#fff3c7] font-bold text-sm text-center focus:outline-none p-0 m-0 border-0"
                            style="line-height: 1; vertical-align: baseline;">
                    </div>

                    <!-- Nút/nhãn tên server (chọn nhanh từ danh sách - tên thuần túy) -->
                    <div class="relative flex items-center min-w-0">
                        <select id="select_server" title="Chọn nhanh Server"
                            class="bg-black/60 text-[#fff3c7] border border-[#e5ac27]/70 rounded-xl pl-2 pr-5 py-1 text-xs sm:text-sm font-bold shadow-[inset_0_0_10px_rgba(0,0,0,0.9)] focus:outline-none focus:border-[#ffcf40] appearance-none cursor-pointer max-w-[115px] sm:max-w-[140px] truncate">
                            <option value="1" class="bg-[#0a0806] text-[#fff3c7]">Tung Sơn</option>
                            <option value="3" class="bg-[#0a0806] text-[#fff3c7]">Hoàng Hải</option>
                            <option value="4" class="bg-[#0a0806] text-[#fff3c7]">Hoa Sơn</option>
                            <option value="6" class="bg-[#0a0806] text-[#fff3c7]">Phật Sơn</option>
                            <option value="7" class="bg-[#0a0806] text-[#fff3c7]">Thái Sơn</option>
                            <option value="8" class="bg-[#0a0806] text-[#fff3c7]">Tuyết Sơn</option>
                            <option value="9" class="bg-[#0a0806] text-[#fff3c7]">Kim Sơn</option>
                            <option value="10" class="bg-[#0a0806] text-[#fff3c7]">Hằng Sơn</option>
                            <option value="11" class="bg-[#0a0806] text-[#fff3c7]">Thiên Sơn</option>
                            <option value="13" class="bg-[#0a0806] text-[#fff3c7]">Hành Sơn</option>
                            <option value="14" class="bg-[#0a0806] text-[#fff3c7]">Vu Sơn</option>
                            <option value="15" class="bg-[#0a0806] text-[#fff3c7]">Dược Sơn</option>
                            <option value="16" class="bg-[#0a0806] text-[#fff3c7]">Khánh Sơn</option>
                            <option value="17" class="bg-[#0a0806] text-[#fff3c7]">Nam Hải</option>
                            <option value="18" class="bg-[#0a0806] text-[#fff3c7]">Long Giang</option>
                            <option value="19" class="bg-[#0a0806] text-[#fff3c7]">Lương Sơn</option>
                            <option value="20" class="bg-[#0a0806] text-[#fff3c7]">Thục Cương Sơn</option>
                            <option value="21" class="bg-[#0a0806] text-[#fff3c7]">Thanh Thành Sơn</option>
                            <option value="" id="opt_no_server" class="bg-[#0a0806] text-red-400" disabled hidden>Không có</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-1.5 text-[#ffcf40]">
                            <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Khu vực TỶ GIÁ (Chữ TỶ GIÁ đặt sát bên trái ô 90đ) -->
                <div class="flex items-center space-x-1.5 shrink-0">
                    <span class="text-[10px] sm:text-[11px] text-[#ffcf40] tracking-wider font-bold uppercase whitespace-nowrap">Tỷ Giá</span>
                    <div class="flex items-center space-x-1 border border-[#e5ac27]/70 bg-black/60 rounded-xl px-2 py-1 shadow-[inset_0_0_10px_rgba(0,0,0,0.9)]">
                        <!-- Nút Tăng / Giảm tỉ giá mini -->
                        <div class="flex flex-col justify-center space-y-0.5 pr-1 border-r border-[#e5ac27]/40">
                            <button type="button" id="btn_rate_up" title="Tăng tỉ giá" 
                                class="w-3.5 h-2.5 flex items-center justify-center text-[#ffcf40] hover:text-[#fff3c7] active:scale-75 transition-all">
                                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 15l7-7 7 7"/>
                                </svg>
                            </button>
                            <button type="button" id="btn_rate_down" title="Giảm tỉ giá" 
                                class="w-3.5 h-2.5 flex items-center justify-center text-[#ffcf40] hover:text-[#fff3c7] active:scale-75 transition-all">
                                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M19 9l-7 7-7-7"/>
                                </svg>
                            </button>
                        </div>
                        <input type="text" inputmode="numeric" id="input_rate" value="90" 
                            class="w-6 sm:w-7 bg-transparent text-[#fff3c7] font-bold text-xs sm:text-sm text-right focus:outline-none">
                        <span class="text-[#ffcf40] text-xs font-bold">đ</span>
                    </div>
                </div>
            </div>

            <!-- Form Inputs -->
            <div class="space-y-2.5">
                
                <!-- Kim Đĩnh & Xu (Game) trên 1 hàng (2 cột bằng nhau) -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <div class="mb-1 px-1 flex justify-between items-end gap-1">
                            <label class="text-[10px] sm:text-[11px] font-bold text-[#ffcf40] tracking-wide uppercase shrink-0">Kim Đĩnh</label>
                            <span id="sub_kd" class="text-[10px] sm:text-[11px] font-bold text-[#4ade80] drop-shadow-[0_0_2px_rgba(74,222,128,0.8)] text-right truncate"></span>
                        </div>
                        <input type="text" inputmode="numeric" id="input_kd" placeholder="0"
                            class="w-full bg-[#030201] border border-[#e5ac27]/60 text-[#fff3c7] text-base sm:text-lg font-bold rounded-[0.75rem] px-3 sm:px-4 py-2 focus:outline-none focus:border-[#ffcf40] focus:ring-1 focus:ring-[#ffcf40]/60 shadow-[inset_0_2px_10px_rgba(0,0,0,1)] transition-all">
                    </div>

                    <div>
                        <div class="mb-1 px-1 flex justify-between items-end gap-1">
                            <label class="text-[10px] sm:text-[11px] font-bold text-[#ffcf40] tracking-wide uppercase shrink-0">Xu (Game)</label>
                            <span id="sub_xu" class="text-[10px] sm:text-[11px] font-bold text-[#4ade80] drop-shadow-[0_0_2px_rgba(74,222,128,0.8)] text-right truncate"></span>
                        </div>
                        <input type="text" inputmode="numeric" id="input_xu" placeholder="0"
                            class="w-full bg-[#030201] border border-[#e5ac27]/60 text-[#fff3c7] text-base sm:text-lg font-bold rounded-[0.75rem] px-3 sm:px-4 py-2 focus:outline-none focus:border-[#ffcf40] focus:ring-1 focus:ring-[#ffcf40]/60 shadow-[inset_0_2px_10px_rgba(0,0,0,1)] transition-all">
                    </div>
                </div>

                <!-- Tiền (VNĐ) -->
                <div>
                    <div class="mb-1 px-1 flex justify-between items-end gap-1">
                        <label class="text-[11px] font-bold text-[#ffcf40] tracking-wide uppercase shrink-0">Tiền (VNĐ)</label>
                        <span id="sub_vnd" class="text-[11px] font-bold text-[#4ade80] drop-shadow-[0_0_2px_rgba(74,222,128,0.8)] text-right truncate"></span>
                    </div>
                    <input type="text" inputmode="numeric" id="input_vnd" placeholder="0"
                        class="w-full bg-[#030201] border border-[#e5ac27]/60 text-[#fff3c7] text-lg font-bold rounded-[0.75rem] px-4 py-2 focus:outline-none focus:border-[#ffcf40] focus:ring-1 focus:ring-[#ffcf40]/60 shadow-[inset_0_2px_10px_rgba(0,0,0,1)] transition-all">
                </div>

                <!-- Cụm chọn chế độ túi: 1 hàng ngang gọn gàng, khung 2 nút căn chuẩn bằng đúng 2 ô KĐ Dư và Xu Dư bên dưới -->
                <div class="grid grid-cols-4 gap-1.5 items-center pt-1">
                    <div class="col-span-2 px-1 flex items-center">
                        <span class="text-[10px] sm:text-[11px] font-bold text-[#ffcf40] tracking-wide uppercase truncate">
                            Số Lượng Túi KĐ:
                        </span>
                    </div>
                    <div class="col-span-2 flex items-center space-x-1 bg-black/60 p-0.5 rounded-lg border border-[#e5ac27]/50 shadow-inner">
                        <button type="button" id="btn_mode_ceil" 
                            class="flex-1 py-1 rounded-md font-bold text-[10px] sm:text-[11px] transition-all bg-[#ffcf40] text-black shadow-sm active:scale-95 text-center">
                            Mua Đủ
                        </button>
                        <button type="button" id="btn_mode_floor" 
                            class="flex-1 py-1 rounded-md font-bold text-[10px] sm:text-[11px] transition-all text-[#e5ac27] hover:text-[#fff3c7] active:scale-95 text-center">
                            Mua Thiếu
                        </button>
                    </div>
                </div>

                <!-- 4 Ô Kết Quả (Túi Lớn, Túi Nhỏ có thể nhập trực tiếp; KĐ Dư/Thiếu, Xu Dư/Thiếu) -->
                <div class="grid grid-cols-4 gap-1.5 pt-0.5">
                    <div class="bg-[#030201] border border-[#e5ac27]/60 rounded-[0.75rem] p-1.5 text-center shadow-[inset_0_2px_10px_rgba(0,0,0,1)] focus-within:border-[#ffcf40] focus-within:ring-1 focus-within:ring-[#ffcf40]/60 transition-all">
                        <label for="input_tl" class="block text-[9px] sm:text-[10px] font-bold text-[#ffcf40] tracking-wide uppercase mb-0.5 cursor-pointer">Túi Lớn</label>
                        <input type="text" inputmode="numeric" id="input_tl" value="0" placeholder="0"
                            class="w-full bg-transparent text-[#fff3c7] font-bold text-sm sm:text-base text-center focus:outline-none focus:text-[#ffcf40] transition-colors">
                    </div>
                    <div class="bg-[#030201] border border-[#e5ac27]/60 rounded-[0.75rem] p-1.5 text-center shadow-[inset_0_2px_10px_rgba(0,0,0,1)] focus-within:border-[#ffcf40] focus-within:ring-1 focus-within:ring-[#ffcf40]/60 transition-all">
                        <label for="input_tn" class="block text-[9px] sm:text-[10px] font-bold text-[#ffcf40] tracking-wide uppercase mb-0.5 cursor-pointer">Túi Nhỏ</label>
                        <input type="text" inputmode="numeric" id="input_tn" value="0" placeholder="0"
                            class="w-full bg-transparent text-[#fff3c7] font-bold text-sm sm:text-base text-center focus:outline-none focus:text-[#ffcf40] transition-colors">
                    </div>
                    <div id="box_kd_diff" class="bg-[#030201] border border-[#e5ac27]/60 rounded-[0.75rem] p-1.5 text-center shadow-[inset_0_2px_10px_rgba(0,0,0,1)] transition-colors">
                        <p class="text-[9px] sm:text-[10px] font-bold text-[#ffcf40] tracking-wide uppercase mb-1 transition-colors" id="label_kddudu">KĐ Dư</p>
                        <p class="text-[#fff3c7] font-bold text-sm sm:text-base transition-colors" id="res_kddudu">0</p>
                    </div>
                    <div id="box_xu_diff" class="bg-[#030201] border border-[#e5ac27]/60 rounded-[0.75rem] p-1.5 text-center shadow-[inset_0_2px_10px_rgba(0,0,0,1)] transition-colors">
                        <p class="text-[9px] sm:text-[10px] font-bold text-[#ffcf40] tracking-wide uppercase mb-1 transition-colors" id="label_xududu">Xu Dư</p>
                        <p class="text-[#fff3c7] font-bold text-sm sm:text-base transition-colors" id="res_xududu">0</p>
                    </div>
                </div>

                <!-- DẢI PHÂN CÁCH HOA VĂN -->
                <div class="flex items-center justify-center py-2">
                    <div class="h-px w-full bg-gradient-to-r from-transparent to-[#e5ac27]/70"></div>
                    <div class="mx-4 flex items-center space-x-1.5">
                        <div class="w-1.5 h-1.5 rotate-45 bg-[#e5ac27]"></div>
                        <div class="w-2.5 h-2.5 rotate-45 border border-[#e5ac27]"></div>
                        <div class="w-1.5 h-1.5 rotate-45 bg-[#e5ac27]"></div>
                    </div>
                    <div class="h-px w-full bg-gradient-to-l from-transparent to-[#e5ac27]/70"></div>
                </div>

                <!-- KHU VỰC KẾT QUẢ TÀI CHÍNH -->
                <div class="space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-[#030201]/50 border border-[#e5ac27]/30 rounded-lg p-2 text-center">
                            <p class="text-[10px] sm:text-[11px] font-bold text-[#ffcf40] tracking-wide uppercase mb-1">Vốn Nhập (85%)</p>
                            <p class="text-[#fff3c7] font-bold text-sm sm:text-base" id="res_cost">0 đ</p>
                        </div>
                        <div class="bg-[#030201]/50 border border-[#e5ac27]/30 rounded-lg p-2 text-center">
                            <p class="text-[10px] sm:text-[11px] font-bold text-[#ffcf40] tracking-wide uppercase mb-1">Tổng Lãi (15%)</p>
                            <p class="text-[#fff3c7] font-bold text-sm sm:text-base" id="res_2ae">0 đ</p>
                        </div>
                        <div class="bg-[#030201]/50 border border-[#e5ac27]/30 rounded-lg p-2 text-center">
                            <p class="text-[10px] sm:text-[11px] font-bold text-[#ffcf40] tracking-wide uppercase mb-1">Thực Lãi (7,5%)</p>
                            <p class="text-[#fff3c7] font-bold text-sm sm:text-base" id="res_thucnhan">0 đ</p>
                        </div>
                        <div class="bg-[#030201]/50 border border-[#e5ac27]/30 rounded-lg p-2 text-center ring-1 ring-[#ffcf40]/30 shadow-[inset_0_0_8px_rgba(255,208,67,0.1)]">
                            <p class="text-[10px] sm:text-[11px] font-bold text-[#ffcf40] tracking-wide uppercase mb-1">Cần Thanh Toán</p>
                            <p class="text-[#fde38c] font-bold text-sm sm:text-base drop-shadow-[0_0_3px_rgba(255,208,67,0.8)]" id="res_gui">0 đ</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Javascript Logic -->
    <script>
        // Quy chuẩn game:
        // 1 Túi Lớn = 340 Xu = 3,400 Kim Đĩnh
        // 1 Túi Nhỏ = 34 Xu = 340 Kim Đĩnh
        // 10 Túi Nhỏ gom thành 1 Túi Lớn
        const XU_TUI_LON = 340;     
        const KD_TUI_LON = 3400;    
        
        const XU_TUI_NHO = 34;      
        const KD_TUI_NHO = 340;     

        let bagMode = 'ceil';           // 'ceil': Mua Đủ; 'floor': Mua Thiếu
        let lastInput = 'kd';           // 'kd' | 'xu' | 'vnd'

        const els = {
            rate: document.getElementById('input_rate'),
            kd: document.getElementById('input_kd'),
            xu: document.getElementById('input_xu'),
            vnd: document.getElementById('input_vnd')
        };

        // ==============================================================
        // LƯU TRỮ VÀ KHÔI PHỤC TỈ GIÁ (LOCALSTORAGE)
        // ==============================================================
        function loadSavedRate() {
            try {
                const savedRate = localStorage.getItem('kimdinh_rate');
                if (savedRate && !isNaN(parseFloat(savedRate)) && parseFloat(savedRate) > 0) {
                    els.rate.value = savedRate;
                }
            } catch (e) {
                console.warn('Không thể đọc từ localStorage', e);
            }
        }

        function saveRate(rateVal) {
            try {
                localStorage.setItem('kimdinh_rate', rateVal);
            } catch (e) {
                console.warn('Không thể lưu vào localStorage', e);
            }
        }

        // Tự động khôi phục Tỉ giá đã lưu khi vừa tải trang
        loadSavedRate();

        const resEls = {
            tl: document.getElementById('input_tl'),
            tn: document.getElementById('input_tn'),
            label_kddudu: document.getElementById('label_kddudu'),
            kddudu: document.getElementById('res_kddudu'),
            label_xududu: document.getElementById('label_xududu'),
            xududu: document.getElementById('res_xududu'),
            box_kd: document.getElementById('box_kd_diff'),
            box_xu: document.getElementById('box_xu_diff'),
            cost: document.getElementById('res_cost'),
            two_ae: document.getElementById('res_2ae'),
            thucnhan: document.getElementById('res_thucnhan'),
            gui: document.getElementById('res_gui')
        };

        const subEls = {
            kd: document.getElementById('sub_kd'),
            xu: document.getElementById('sub_xu'),
            vnd: document.getElementById('sub_vnd')
        };

        const btnModeCeil = document.getElementById('btn_mode_ceil');
        const btnModeFloor = document.getElementById('btn_mode_floor');
        const btnRateUp = document.getElementById('btn_rate_up');
        const btnRateDown = document.getElementById('btn_rate_down');

        function updateModeButtonStyles() {
            if (bagMode === 'ceil') {
                btnModeCeil.className = "flex-1 py-1 rounded-md font-bold text-[10px] sm:text-[11px] transition-all bg-[#ffcf40] text-black shadow-sm active:scale-95 text-center";
                btnModeFloor.className = "flex-1 py-1 rounded-md font-bold text-[10px] sm:text-[11px] transition-all text-[#e5ac27] hover:text-[#fff3c7] active:scale-95 text-center";
            } else {
                btnModeFloor.className = "flex-1 py-1 rounded-md font-bold text-[10px] sm:text-[11px] transition-all bg-[#ffcf40] text-black shadow-sm active:scale-95 text-center";
                btnModeCeil.className = "flex-1 py-1 rounded-md font-bold text-[10px] sm:text-[11px] transition-all text-[#e5ac27] hover:text-[#fff3c7] active:scale-95 text-center";
            }
        }

        // Chuyển đổi qua lại giữa 2 chế độ Mua Đủ / Mua Thiếu
        function setBagMode(mode) {
            bagMode = mode;
            updateModeButtonStyles();
            recalculateCurrent();
        }

        btnModeCeil.addEventListener('click', () => setBagMode('ceil'));
        btnModeFloor.addEventListener('click', () => setBagMode('floor'));

        // Xử lý nút tăng / giảm tỉ giá nhanh (kèm lưu vào localStorage)
        btnRateUp.addEventListener('click', () => {
            let currentRate = parseFloat(els.rate.value) || 0;
            currentRate += 1;
            els.rate.value = currentRate;
            saveRate(currentRate);
            recalculateCurrent();
        });

            let currentRate = parseFloat(els.rate.value) || 0;
            if (currentRate > 1) {
                currentRate -= 1;
                els.rate.value = currentRate;
                saveRate(currentRate);
                recalculateCurrent();
            }
        });

        // ==============================================================
        // QUẢN LÝ ĐỒNG BỘ SERVER (SỐ HIỆU & TÊN SERVER)

        const elServerNum = document.getElementById('input_server_num');
        const elServerSelect = document.getElementById('select_server');

        // Khi người dùng chọn từ danh sách dropdown
        elServerSelect.addEventListener('change', function() {
            if (this.value) {
                elServerNum.value = this.value;
                if (optNoServer) optNoServer.hidden = true;
            }
        });

        // Khi người dùng gõ số vào ô số hiệu server (ví dụ gõ 3)
        elServerNum.addEventListener('input', function() {
            let raw = this.value.replace(/\D/g, ''); // chỉ nhận ký tự số
            this.value = raw;
            if (raw === "") {
                if (optNoServer) {
                    optNoServer.hidden = false;
                    elServerSelect.value = "";
                }
                return;
            }

            let num = parseInt(raw, 10);
            let found = SERVER_LIST.find(s => s.id === num);

            if (found) {
                if (optNoServer) optNoServer.hidden = true;
                elServerSelect.value = String(found.id);

                // Nếu số server không có trong danh sách -> hiển thị "Không có"
                if (optNoServer) {
                    optNoServer.hidden = false;

                this.value = "1";

        function recalculateCurrent() {
            if (lastInput === 'xu') {
                let val = parseFloat(els.xu.value.replace(/,/g, '')) || 0;
                calculateFromXu(val);
            } else if (lastInput === 'vnd') {
                let val = parseFloat(els.vnd.value.replace(/,/g, '')) || 0;
                calculateFromVND(val);
            } else if (lastInput === 'bag') {
                calculateFromBags();
            } else {
                let val = parseFloat(els.kd.value.replace(/,/g, '')) || 0;
                calculateFromKD(val);
            }
        }

        function formatNum(num) {
            if (num === null || num === undefined || isNaN(num)) return "0";
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function formatUnit(val, type) {
            if (!val || val <= 0) return "";
            val = Math.floor(val);
            if (type === 'vnd') {
                let ty = Math.floor(val / 1000000000);
                let remTy = val % 1000000000;
                let tr = Math.floor(remTy / 1000000);
                let remTr = remTy % 1000000;
                let ngan = Math.floor(remTr / 1000);
                let le = remTr % 1000;

                let parts = [];
                if (ty > 0) parts.push(formatNum(ty) + " tỷ");
                if (tr > 0) parts.push(formatNum(tr) + " triệu");
                if (ngan > 0) parts.push(formatNum(ngan) + " ngàn");
                if (le > 0 && ty === 0 && tr === 0 && ngan === 0) parts.push(formatNum(le));

                return (parts.join(" ") || formatNum(val)) + " đ";
            }
            if (type === 'kd' || type === 'xu') {
                if (val >= 10000) {
                    let van = Math.floor(val / 10000);
                    let rem = val % 10000;
                    return formatNum(van) + " vạn" + (rem > 0 ? " " + formatNum(rem) : "");
                }
                return formatNum(val);
            }
            return formatNum(val);
        }

        // CÔNG THỨC TÀI CHÍNH:
        // - Vốn Nhập = 85% tổng tiền VNĐ
        // - Tổng Lãi = tổng tiền VNĐ * 15%
        // - Thực Lãi = 50% của Tổng Lãi
        // - Cần Thanh Toán = Vốn Nhập + Thực Lãi
        function updateFinancials(totalVND) {
            let cost = totalVND * 0.85;
            let totalProfit = totalVND * 0.15;
            let thucnhan = totalProfit * 0.50;
            let needPay = cost + thucnhan;

            resEls.cost.innerText = formatNum(Math.round(cost)) + " đ";
            resEls.two_ae.innerText = formatNum(Math.round(totalProfit)) + " đ";
            resEls.thucnhan.innerText = formatNum(Math.round(thucnhan)) + " đ";
            resEls.gui.innerText = formatNum(Math.round(needPay)) + " đ";
        }

        // Hiển thị trạng thái DƯ (màu vàng hoàng kim bình thường)
        function showDiffNormal(tl, tn, kdDu, xuDu) {
            if (document.activeElement !== resEls.tl) resEls.tl.value = formatNum(tl);
            if (document.activeElement !== resEls.tn) resEls.tn.value = formatNum(tn);

            resEls.label_kddudu.innerText = "KĐ Dư";
            resEls.label_kddudu.className = "text-[9px] sm:text-[10px] font-bold text-[#ffcf40] tracking-wide uppercase mb-1";
            resEls.kddudu.className = "text-[#fff3c7] font-bold text-sm sm:text-base";
            resEls.kddudu.innerText = formatNum(kdDu);

            resEls.label_xududu.innerText = "Xu Dư";
            resEls.label_xududu.className = "text-[9px] sm:text-[10px] font-bold text-[#ffcf40] tracking-wide uppercase mb-1";
            resEls.xududu.className = "text-[#fff3c7] font-bold text-sm sm:text-base";
            resEls.xududu.innerText = formatNum(xuDu);

            resEls.box_kd.className = "bg-[#030201] border border-[#e5ac27]/60 rounded-[0.75rem] p-1.5 text-center shadow-[inset_0_2px_10px_rgba(0,0,0,1)] transition-colors";
            resEls.box_xu.className = "bg-[#030201] border border-[#e5ac27]/60 rounded-[0.75rem] p-1.5 text-center shadow-[inset_0_2px_10px_rgba(0,0,0,1)] transition-colors";
        }

        // Hiển thị trạng thái THIẾU (màu đỏ cảnh báo)
        function showDiffAlert(tl, tn, kdThieu, xuThieu) {
            if (document.activeElement !== resEls.tl) resEls.tl.value = formatNum(tl);
            if (document.activeElement !== resEls.tn) resEls.tn.value = formatNum(tn);

            resEls.label_kddudu.innerText = "KĐ Thiếu";
            resEls.label_kddudu.className = "text-[9px] sm:text-[10px] font-bold text-red-500 tracking-wide uppercase mb-1";
            resEls.kddudu.className = "text-red-400 font-bold text-sm sm:text-base drop-shadow-[0_0_3px_rgba(239,68,68,0.7)]";
            resEls.kddudu.innerText = formatNum(kdThieu);

            resEls.label_xududu.innerText = "Xu Thiếu";
            resEls.label_xududu.className = "text-[9px] sm:text-[10px] font-bold text-red-500 tracking-wide uppercase mb-1";
            resEls.xududu.className = "text-red-400 font-bold text-sm sm:text-base drop-shadow-[0_0_3px_rgba(239,68,68,0.7)]";
            resEls.xududu.innerText = formatNum(xuThieu);

            resEls.box_kd.className = "bg-[#030201] border border-red-500/70 rounded-[0.75rem] p-1.5 text-center shadow-[inset_0_2px_10px_rgba(239,68,68,0.2)] transition-colors";
            resEls.box_xu.className = "bg-[#030201] border border-red-500/70 rounded-[0.75rem] p-1.5 text-center shadow-[inset_0_2px_10px_rgba(239,68,68,0.2)] transition-colors";
        }

        function resetAll() {
            resEls.tl.value = "0";
            resEls.tn.value = "0";
            showDiffNormal(0, 0, 0, 0);
            subEls.kd.innerText = "";
            subEls.xu.innerText = "";
            subEls.vnd.innerText = "";
            updateFinancials(0);
        }

        // ==============================================================
        // CHIỀU 1: NHẬP XU TRỰC TIẾP
        // - Số Xu trong ô Xu là CỐ ĐỊNH do người dùng nhập.
        // - Ô Kim Đĩnh hiển thị CHÍNH XÁC lượng Kim Đĩnh THỰC TẾ mở ra.
        // - Kết quả bên dưới: Xu Dư và KĐ Dư hiển thị chuẩn xác số dư thực tế trong ví túi.
        // ==============================================================
        function calculateFromXu(inputXu) {
            lastInput = 'xu';
            let rate = parseFloat(els.rate.value) || 0;

            if (inputXu <= 0) {
                els.kd.value = "";
                els.vnd.value = "";
                resetAll();
                return;
            }

            // 1. Tính số túi mua được tối đa từ tổng số Xu đó
            let tl = Math.floor(inputXu / XU_TUI_LON);
            let remXu = inputXu % XU_TUI_LON;
            let tn = Math.floor(remXu / XU_TUI_NHO);
            let xuDu = remXu % XU_TUI_NHO; // Số Xu dư thực tế trong ví không đủ mua thêm túi
            let kdDu = xuDu * 10;          // Số KĐ dư tương ứng

            // 2. Kim Đĩnh THỰC TẾ mở ra từ các túi trên
            let realKD = (tl * KD_TUI_LON) + (tn * KD_TUI_NHO);

            // 3. Hiển thị chính xác lượng Kim Đĩnh THỰC TẾ mở ra ở ô Kim Đĩnh
            els.kd.value = formatNum(realKD);

            // 4. Tiền VNĐ tính theo lượng Kim Đĩnh thực tế mở ra
            let totalVND = realKD * rate;
            els.vnd.value = totalVND > 0 ? formatNum(Math.round(totalVND)) : "0";

            // 5. Hiển thị chuẩn xác Xu Dư và KĐ Dư màu vàng
            showDiffNormal(tl, tn, kdDu, xuDu);

            subEls.xu.innerText = formatUnit(inputXu, 'xu');
            subEls.kd.innerText = formatUnit(realKD, 'kd');
            subEls.vnd.innerText = formatUnit(Math.round(totalVND), 'vnd');

            updateFinancials(totalVND);
        }

        // ==============================================================
        // CHIỀU 2: NHẬP KIM ĐĨNH (MỤC TIÊU)
        // - Ô Kim Đĩnh LUÔN GIỮ CỐ ĐỊNH mục tiêu mà người dùng nhập (ví dụ 30,000 KĐ),
        //   tuyệt đối không bị thay đổi tự động thành 29,920 hay số khác khi chọn Mua Thiếu.
        // - 'Mua Đủ': Làm tròn lên để mua đủ túi. Ô Xu tự nhảy số Xu chi. KĐ Dư hiện số dư, Xu Dư = 0.
        // - 'Mua Thiếu': Làm tròn xuống gói túi sát nhất. Ô Xu tự nhảy số Xu chi.
        //   Bên dưới hiển thị chính xác 'KĐ Thiếu' và 'Xu Thiếu' (tính theo gói túi cần mua bù).
        // ==============================================================
        function calculateFromKD(targetKD) {
            lastInput = 'kd';
            let rate = parseFloat(els.rate.value) || 0;

            if (targetKD <= 0) {
                els.xu.value = "";
                els.vnd.value = "";
                resetAll();
                return;
            }

            let totalVND = targetKD * rate;
            els.vnd.value = totalVND > 0 ? formatNum(Math.round(totalVND)) : "0";

            if (bagMode === 'ceil') {
                // CHẾ ĐỘ 1: MUA ĐỦ - Làm tròn lên
                let totalTuiNho = Math.ceil(targetKD / KD_TUI_NHO);
                let tl = Math.floor(totalTuiNho / 10);
                let tn = totalTuiNho % 10;

                let totalKDGot = (tl * KD_TUI_LON) + (tn * KD_TUI_NHO);
                let xuNeedSpent = (tl * XU_TUI_LON) + (tn * XU_TUI_NHO);

                // Ô Xu tự động hiển thị số Xu cần chi để mua đủ túi
                els.xu.value = xuNeedSpent > 0 ? formatNum(xuNeedSpent) : "0";

                let kdDu = totalKDGot - targetKD;
                let xuDu = 0; // Đã gom trọn vào túi nên xu lẻ trong ví = 0

                showDiffNormal(tl, tn, kdDu, xuDu);

                subEls.kd.innerText = formatUnit(targetKD, 'kd');
                subEls.xu.innerText = formatUnit(xuNeedSpent, 'xu');
                subEls.vnd.innerText = formatUnit(Math.round(totalVND), 'vnd');

                updateFinancials(totalVND);
            } else {
                // CHẾ ĐỘ 2: MUA THIẾU - Làm tròn xuống gói túi sát nhất
                // Ô Kim Đĩnh VẪN GIỮ NGUYÊN mục tiêu (ví dụ 30,000 KĐ)
                let totalTuiNho = Math.floor(targetKD / KD_TUI_NHO);
                let tl = Math.floor(totalTuiNho / 10);
                let tn = totalTuiNho % 10;

                let totalKDGot = (tl * KD_TUI_LON) + (tn * KD_TUI_NHO);
                let xuNeedSpent = (tl * XU_TUI_LON) + (tn * XU_TUI_NHO);

                // Ô Xu hiển thị số Xu chi cho gói túi sát nhất này
                els.xu.value = xuNeedSpent > 0 ? formatNum(xuNeedSpent) : "0";

                let kdDiff = totalKDGot - targetKD;

                if (kdDiff < 0) {
                    // BỊ THIẾU SO VỚI MỤC TIÊU
                    let kdThieu = Math.abs(kdDiff);

                    // Số Xu Thiếu tính theo đơn vị gói túi thực tế cần mua thêm để bù đủ
                    let tuiNhoCanBu = Math.ceil(kdThieu / KD_TUI_NHO);
                    let tlBu = Math.floor(tuiNhoCanBu / 10);
                    let tnBu = tuiNhoCanBu % 10;
                    let xuThieu = (tlBu * XU_TUI_LON) + (tnBu * XU_TUI_NHO);

                    // Đổi sang KĐ Thiếu và Xu Thiếu màu đỏ cảnh báo
                    showDiffAlert(tl, tn, kdThieu, xuThieu);
                } else {
                    // Khớp đúng mục tiêu (chia hết)
                    showDiffNormal(tl, tn, 0, 0);
                }

                subEls.kd.innerText = formatUnit(targetKD, 'kd');
                subEls.xu.innerText = formatUnit(xuNeedSpent, 'xu');
                subEls.vnd.innerText = formatUnit(Math.round(totalVND), 'vnd');

                updateFinancials(totalVND);
            }
        }

        // ==============================================================
        // CHIỀU 3: NHẬP TIỀN (VNĐ)
        // - Quy đổi ra Kim Đĩnh mục tiêu theo tỉ giá.
        // - Ô Tiền VNĐ là CỐ ĐỊNH do người dùng nhập, tuyệt đối không bị ghi đè.
        // - Tính toán số lượng túi và Xu Game theo chế độ Mua Đủ / Mua Thiếu.
        // ==============================================================
        function calculateFromVND(totalVND) {
            lastInput = 'vnd';
            let rate = parseFloat(els.rate.value) || 0;

            if (totalVND <= 0) {
                els.kd.value = "";
                els.xu.value = "";
                subEls.vnd.innerText = "";
                subEls.kd.innerText = "";
                subEls.xu.innerText = "";
                resetAll();
                updateFinancials(0);
                return;
            }

            // Cập nhật nhãn phụ VNĐ và các chỉ số tài chính theo đúng số tiền người dùng nhập
            subEls.vnd.innerText = formatUnit(Math.round(totalVND), 'vnd');
            updateFinancials(totalVND);

            if (rate <= 0) {
                els.kd.value = "0";
                els.xu.value = "0";
                resetAll();
                return;
            }

            // Quy đổi sang Kim Đĩnh mục tiêu theo tỉ giá
            let targetKD = Math.round(totalVND / rate);
            els.kd.value = targetKD > 0 ? formatNum(targetKD) : "0";
            subEls.kd.innerText = targetKD > 0 ? formatUnit(targetKD, 'kd') : "";

            if (targetKD <= 0) {
                els.xu.value = "0";
                subEls.xu.innerText = "";
                showDiffNormal(0, 0, 0, 0);
                return;
            }

            if (bagMode === 'ceil') {
                // CHẾ ĐỘ 1: MUA ĐỦ - Làm tròn lên
                let totalTuiNho = Math.ceil(targetKD / KD_TUI_NHO);
                let tl = Math.floor(totalTuiNho / 10);
                let tn = totalTuiNho % 10;

                let totalKDGot = (tl * KD_TUI_LON) + (tn * KD_TUI_NHO);
                let xuNeedSpent = (tl * XU_TUI_LON) + (tn * XU_TUI_NHO);

                els.xu.value = xuNeedSpent > 0 ? formatNum(xuNeedSpent) : "0";

                let kdDu = totalKDGot - targetKD;
                let xuDu = 0; // Đã gom trọn vào túi nên xu lẻ trong ví = 0

                showDiffNormal(tl, tn, kdDu, xuDu);
                subEls.xu.innerText = formatUnit(xuNeedSpent, 'xu');
            } else {
                // CHẾ ĐỘ 2: MUA THIẾU - Làm tròn xuống gói túi sát nhất
                let totalTuiNho = Math.floor(targetKD / KD_TUI_NHO);
                let tl = Math.floor(totalTuiNho / 10);
                let tn = totalTuiNho % 10;

                let totalKDGot = (tl * KD_TUI_LON) + (tn * KD_TUI_NHO);
                let xuNeedSpent = (tl * XU_TUI_LON) + (tn * XU_TUI_NHO);

                els.xu.value = xuNeedSpent > 0 ? formatNum(xuNeedSpent) : "0";

                let kdDiff = totalKDGot - targetKD;

                if (kdDiff < 0) {
                    let kdThieu = Math.abs(kdDiff);
                    let tuiNhoCanBu = Math.ceil(kdThieu / KD_TUI_NHO);
                    let tlBu = Math.floor(tuiNhoCanBu / 10);
                    let tnBu = tuiNhoCanBu % 10;
                    let xuThieu = (tlBu * XU_TUI_LON) + (tnBu * XU_TUI_NHO);

                    showDiffAlert(tl, tn, kdThieu, xuThieu);
                } else {
                    showDiffNormal(tl, tn, 0, 0);
                }

                subEls.xu.innerText = formatUnit(xuNeedSpent, 'xu');
            }
        }

        // ==============================================================
        // CHIỀU 4: NHẬP TRỰC TIẾP TÚI LỚN & TÚI NHỎ
        // - Người dùng tự gõ số Túi Lớn / Túi Nhỏ:
        //   Hệ thống tính ngược ra Tổng Kim Đĩnh, Tổng Xu Game, Tiền VNĐ,
        //   các chỉ số tài chính (vốn/lãi/thanh toán) ngay lập tức.
        // ==============================================================
        function calculateFromBags() {
            lastInput = 'bag';
            let rate = parseFloat(els.rate.value) || 0;

            let rawTL = resEls.tl.value.replace(/,/g, '');
            let rawTN = resEls.tn.value.replace(/,/g, '');
            let tl = parseInt(rawTL, 10) || 0;
            let tn = parseInt(rawTN, 10) || 0;

            if (tl < 0) tl = 0;
            if (tn < 0) tn = 0;

            // 1. Tính tổng Kim Đĩnh và Xu Game từ số túi thực tế
            let totalKD = (tl * KD_TUI_LON) + (tn * KD_TUI_NHO);
            let totalXu = (tl * XU_TUI_LON) + (tn * XU_TUI_NHO);

            if (totalKD <= 0) {
                els.kd.value = "";
                els.xu.value = "";
                els.vnd.value = "";
                subEls.kd.innerText = "";
                subEls.xu.innerText = "";
                subEls.vnd.innerText = "";
                updateFinancials(0);
                showDiffNormal(tl, tn, 0, 0);
                return;
            }

            // 2. Cập nhật các ô input phía trên
            els.kd.value = formatNum(totalKD);
            els.xu.value = formatNum(totalXu);

            // 3. Tiền VNĐ tính theo tổng Kim Đĩnh
            let totalVND = totalKD * rate;
            els.vnd.value = totalVND > 0 ? formatNum(Math.round(totalVND)) : "0";

            // 4. KĐ Dư = 0, Xu Dư = 0 (trạng thái màu vàng bình thường)
            showDiffNormal(tl, tn, 0, 0);

            // 5. Cập nhật các nhãn phụ (vạn, triệu, ngàn)
            subEls.kd.innerText = formatUnit(totalKD, 'kd');
            subEls.xu.innerText = formatUnit(totalXu, 'xu');
            subEls.vnd.innerText = formatUnit(Math.round(totalVND), 'vnd');

            // 6. Cập nhật các chỉ số tài chính
            updateFinancials(totalVND);
        }

        // ==============================================================
        // LẮNG NGHE SỰ KIỆN GÕ PHÍM - TÁCH BIỆT CÁC CHIỀU ĐỘC LẬP
        // ==============================================================
        els.xu.addEventListener('focus', function() { this.select(); });
        els.xu.addEventListener('input', function() {
            let rawVal = this.value.replace(/\D/g, '');
            if (rawVal === "") {
                this.value = "";
                calculateFromXu(0);
                return;
            }
            let val = parseInt(rawVal, 10) || 0;
            this.value = formatNum(val);
            calculateFromXu(val);
        });

        els.kd.addEventListener('focus', function() { this.select(); });
        els.kd.addEventListener('input', function() {
            let rawVal = this.value.replace(/\D/g, '');
            if (rawVal === "") {
                this.value = "";
                calculateFromKD(0);
                return;
            }
            let val = parseInt(rawVal, 10) || 0;
            this.value = formatNum(val);
            calculateFromKD(val);
        });

        els.vnd.addEventListener('focus', function() { this.select(); });
        els.vnd.addEventListener('input', function() {
            let rawVal = this.value.replace(/\D/g, '');
            if (rawVal === "") {
                this.value = "";
                calculateFromVND(0);
                return;
            }
            let val = parseInt(rawVal, 10) || 0;
            this.value = formatNum(val);
            calculateFromVND(val);
        });

        // Lắng nghe sự kiện gõ ở ô Túi Lớn và Túi Nhỏ
        resEls.tl.addEventListener('focus', function() { this.select(); });
        resEls.tl.addEventListener('input', function() {
            let raw = this.value.replace(/\D/g, '');
            this.value = raw === "" ? "" : formatNum(parseInt(raw, 10));
            calculateFromBags();
        });
        resEls.tl.addEventListener('blur', function() {
            if (this.value.trim() === "") {
                this.value = "0";
                calculateFromBags();
            }
        });

        resEls.tn.addEventListener('focus', function() { this.select(); });
        resEls.tn.addEventListener('input', function() {
            let raw = this.value.replace(/\D/g, '');
            this.value = raw === "" ? "" : formatNum(parseInt(raw, 10));
            calculateFromBags();
        });
        resEls.tn.addEventListener('blur', function() {
            if (this.value.trim() === "") {
                this.value = "0";
                calculateFromBags();
            }
        });

        els.rate.addEventListener('focus', function() { this.select(); });
        els.rate.addEventListener('input', function() {
            let currentRate = parseFloat(this.value) || 0;
            if (currentRate > 0) {
                saveRate(currentRate);
            }
            recalculateCurrent();
        });
    </script>
